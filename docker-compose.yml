version: '3.8'

services:
  poll:
    build: ./poll
    ports:
      - "5000:80"  
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - poll-tier

  worker:
    build: ./worker
    depends_on:
      - redis
      - db
    environment:
      - REDIS_HOST=redis
      - DB_HOST=db
      - DB_USER=newuser
      - DB_PASSWORD=password
      - DB_NAME=beautyapp
    networks:
      - back-tier

  result:
    build: ./result
    ports:
      - "5001:80"  
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=newuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_PORT=5432
      - POSTGRES_DB=beautyapp
    depends_on:
      - db
    networks:
      - result-tier

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - poll-tier
      - back-tier

  db:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=newuser
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=beautyapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - result-tier
      - back-tier

networks:
  result-tier:
  back-tier:
  poll-tier:


volumes:
  pgdata:


